name: Etapa 0 # Iniciar Exercício

on:
  push:
    branches:
      - main

permissions:
  contents: write # Atualizar o README
  actions: write # Desabilitar/habilitar workflows
  issues: write # Criar issue e comentar em issues

env:
  STEP_1_FILE: ".github/steps/1-create-a-branch.md"

jobs:
  start_exercise:
    if: |
      !github.event.repository.is_template
    name: Iniciar Exercício
    uses: skills/exercise-toolkit/.github/workflows/start-exercise.yml@v0.8.1
    with:
      exercise-title: "Introdução ao GitHub"
      intro-message: "Se você é novo(a) no GitHub, pode perceber que seus colegas desenvolvedores usam ___**issues**___ para organizar o trabalho e colaborar. Faremos o mesmo! Esse é outro assunto, mas hoje vamos apresentar os conceitos básicos."

  post_next_step_content:
    name: Publicar conteúdo da próxima etapa
    runs-on: ubuntu-latest
    needs: [start_exercise]
    env:
      ISSUE_REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: ${{ needs.start_exercise.outputs.issue-number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Obter templates de resposta
        uses: actions/checkout@v4
        with:
          repository: skills/exercise-toolkit
          path: exercise-toolkit
          ref: v0.7.0

      - name: Criar comentário - adicionar conteúdo da etapa
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: ${{ env.STEP_1_FILE }}

      - name: Criar comentário - aguardando progresso
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: exercise-toolkit/markdown-templates/step-feedback/watching-for-progress.md

      - name: Desabilitar workflow atual e habilitar próximo
        run: |
          gh workflow enable "Etapa 1"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
